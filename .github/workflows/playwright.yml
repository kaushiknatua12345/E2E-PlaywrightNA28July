name: Playwright E2E Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start JSON Server (backend API)
        run: nohup npx json-server --watch src/app/userdb.json --port 3000 > /tmp/json-server.log 2>&1 &
        env:
          CI: true

      - name: Start Angular dev server
        run: nohup npx ng serve --port 4200 > /tmp/ng-serve.log 2>&1 &
        env:
          CI: true

      - name: Wait for both servers to be ready
        run: |
          echo "Waiting for JSON Server and Angular dev server..."
          npx wait-on http://localhost:3000/users http://localhost:4200 --timeout 120000
          echo "Both servers are up!"
        env:
          CI: true

      - name: Run Playwright tests
        run: npx playwright test --reporter=html,list
        env:
          CI: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (traces & screenshots)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
